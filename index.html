<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="description" content="Tu espacio privado de organización." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f1ed" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0b0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nivra" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Nivra</title>
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('nivra-theme'))
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.style.backgroundColor = dark ? '#0b0b0c' : '#f2f1ed'
        var accent = JSON.parse(localStorage.getItem('nivra-accent'))
        if (accent && accent !== 'basico') document.documentElement.dataset.accent = accent
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
